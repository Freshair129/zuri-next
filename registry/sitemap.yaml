# Product navigation map (sitemap) — the authored half. tools/sitemap.mjs merges this with every
# console path the specification mentions (backticked `/…` paths in feature, domain and product docs)
# and writes docs/governance/plans/sitemap.json, rendered by sitemap.html.
#
# Levels: surface → slot (domain bar entry) → module (sub-domain) → page → view (in-canvas tab or
# client-side view). Every node cites the artifact it comes from; the tool checks each evidence id.
# `path: null` = the specification names the page but not its URL. `planned: true` = named with no
# href in the product (FR-002-007). Labels are the English spec names; Thai UI copy lives in the product.

surfaces:
  - id: web-console
    label: Web console
    role: back office — detail, complex edits, reconciliation, audit, configuration
    users: owners, staff, operator
    evidence: [PRD-001, FEAT-002, FEAT-034, FEAT-035]
  - id: line
    label: LINE
    role: primary surface — AI-native intake and interaction through the Business's LINE Official Accounts
    users: customers, staff
    evidence: [PRD-001, FEAT-093]
    entries:
      - label: Customer conversation (grounded answers, one reply owner per event)
        evidence: [FEAT-093, FEAT-096, FEAT-063]
      - label: Phase 1 activation path (PENDING → real customer answer)
        evidence: [FEAT-065]
      - label: Rich menus and LIFF apps published by the Studio
        evidence: [FEAT-049]
      - label: "Staff command `#sku` — preview before write, verified sender only"
        evidence: [FR-081-003]
      - label: Staff asset intake handoff (photo + payment proof)
        evidence: [FEAT-087, FR-086-002]
      - label: Consent attestation on first contact
        evidence: [FEAT-043]
  - id: enterprise-api
    label: Enterprise API
    role: upsert and resolve by external ids through the intake pipeline (Tenant-bound API keys, OpenAPI)
    users: integrators
    evidence: [PRD-001, FEAT-008]
    entries:
      - label: Intake envelope upsert / resolve
        evidence: [FEAT-008, FEAT-007]
      - label: Usage report endpoint (deployment bearer)
        evidence: [FR-037-003]
  - id: plugin-mcp
    label: Plugin / MCP
    role: agent clients acting for a signed-in person (PKCE public client; capabilities from the person's authority)
    users: agent tools
    evidence: [PRD-001, FEAT-028]
    entries:
      - label: Plugin authorization and capability discovery
        evidence: [FEAT-028]
      - label: Read tools (Gate E) and write tools (Gate F) over domain services
        evidence: [FEAT-061, ADR-100]

# Entry flow before the Business shell: no domain bar, no shell chrome.
entry:
  label: Entry
  domain: DOM-IAM
  paths: [/, /login, /signup, /businesses, /profile]
  evidence: [FEAT-002, FEAT-023, FEAT-025]
  pages:
    - path: /
      label: Landing
      note: Full-viewport branded landing with exactly one action, to /login; renders outside the shell.
      evidence: [FR-002-006, FR-023-002]
    - path: /login
      label: Login
      evidence: [FR-023-002, FEAT-023]
    - path: /signup
      label: Sign up
      note: Self-serve signup is the one door into the product.
      evidence: [FR-025-003]
    - path: null
      label: Password reset (owner-assisted)
      note: No public forgot-password route; an owner resets on the person's behalf.
      evidence: [FR-026-001]
    - path: /profile
      label: My Profile
      note: Profile-first onboarding; a Profile-only member waits in the Waiting Room.
      evidence: [FR-024-001, FR-025-001, FR-025-005]
      views:
        - label: Waiting Room
          evidence: [FR-025-001]
    - path: /businesses
      label: Business chooser
      note: Lists only Businesses the viewer may see; the shell mounts after one is selected.
      evidence: [FR-023-002, AC-002-002-02]

# Domain bar slots of the Business shell. `group` is navigation only (PRD-001 §4, FR-035-001).
# `paths` lists root-level paths that belong to the slot when the first URL segment is not the key.
# A multi-page module renders its pages as in-canvas tabs (FR-035-002); those tabs are `views`.
slots:
  - key: projects
    label: Projects & Work
    domain: DOM-PRJ
    paths: [/overview, /roadmap, /projects, /work, /execution, /timeline, /dependencies, /milestones, /files, /repositories, /workspace]
    note: Six logical modules; only the selected module's views show in content navigation.
    evidence: [FEAT-002, FR-002-007]
    modules:
      - label: Project Management
        evidence: [FR-002-007, FEAT-015, FEAT-003]
      - label: Work Management
        views: [Execution Roadmap, Structure Plan, Board, Work Items, Schedule, Milestones, Dependency Map]
        entered_at: Structure Plan
        evidence: [FR-002-007, FEAT-006, FEAT-010]
      - label: Delivery Design
        views: [Pipeline builder canvas (planned)]
        evidence: [FR-002-007, FEAT-016]
      - label: Resource Coordination
        views: [Team, Files, Repositories]
        evidence: [FR-002-007, FEAT-004, FEAT-017]
      - label: Delivery Governance
        views: [Approvals, Execution trace]
        evidence: [FR-002-007, FEAT-010, FEAT-011]
      - label: Agent Delivery
        views: [Agent / meeting intake, Approval gateway]
        evidence: [FR-002-007, FEAT-010, FEAT-011]
    pages:
      - path: /overview
        label: Business Home (Overview)
        note: Execution KPIs, Project health, strategy and shortcuts for the selected Business; the shell's home.
        evidence: [FR-018-001, FR-018-002]
      - path: /roadmap
        label: Business roadmap, goals and key results
        evidence: [FR-019-002, FEAT-019]
        views:
          - label: Balanced scorecard KPIs and 4DX (declared)
            evidence: [FEAT-020]
      - path: /projects
        label: Projects dashboard
        note: Priority, PIC and teams; Project list read contract.
        evidence: [FR-015-001, FR-003-002]
        views:
          - label: Project — Structure Plan (per-Workstream hierarchy)
            evidence: [FR-003-005]
          - label: Project — Board
            evidence: [FR-006-004]
          - label: Project — Execution views (/projects/{id}/execution/{mode})
            evidence: [FR-006-001]
          - label: Project — Dependency Map
            evidence: [FR-006-003]
          - label: Project — Domains view
            evidence: [FR-013-001]
          - label: Project — Team
            evidence: [FR-004-003]
          - label: Project — Inventory snapshot
            evidence: [FEAT-012]
          - label: Project — Features
            evidence: [FEAT-014]
          - label: Project — Import plan (persistent action, dry run and preview)
            evidence: [FR-007-002, FEAT-009]
      - path: /work
        label: Work Items (All Work)
        evidence: [FR-003-006]
        views:
