            evidence: [FR-007-006]
      - path: /execution
        label: Execution views by mode
        note: Sprint board, Migration monitor, Sales pipeline, Campaign control, Launch timeline, Operations board, Expansion portfolio at /execution/{mode}.
        evidence: [FR-006-001]
        views:
          - label: Execution Roadmap
            evidence: [FR-010-001]
      - path: /timeline
        label: Schedule (timeline)
        evidence: [FR-002-007]
      - path: /dependencies
        label: Dependency Map
        evidence: [FR-006-003]
      - path: /milestones
        label: Milestones
        evidence: [FR-002-007]
      - path: /files
        label: File Manager
        note: Four client-side views over the same asset set.
        evidence: [FR-017-009]
        views:
          - label: Grid
            evidence: [FR-017-009]
          - label: Timeline
            evidence: [FR-017-009]
          - label: By project
            evidence: [FR-017-009]
          - label: Preview
            evidence: [FR-017-009]
      - path: /repositories
        label: Repositories
        evidence: [FEAT-004]
      - path: /workspace
        label: Workspace (Space) administration
        evidence: [FEAT-001, FR-001-002]

