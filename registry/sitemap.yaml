# Shell-wide controls (not pages): available on every shell route.
shell:
  - label: Domain bar and sidebar (groups SCM, CRM; module tabs in canvas)
    evidence: [FEAT-035, FR-035-001, FR-035-002]
  - label: Base Context Bar (Group › Organization › Business) and breadcrumb
    evidence: [FR-002-002, FR-002-004]
  - label: Command palette (Ctrl+K) over every reachable route
    evidence: [FR-034-002]
  - label: Business shell guard and shell mode
    evidence: [FR-002-005, FR-002-001]
